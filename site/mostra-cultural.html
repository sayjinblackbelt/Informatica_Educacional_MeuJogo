<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#080d19"><title>Mostra Cultural 2026 | Meu Jogo</title>
<style>
:root{color-scheme:dark;--bg:#080d19;--panel:#121c30;--line:#2b3b57;--text:#f4f7fb;--muted:#b4c1d5;--lime:#b8f36b;--cyan:#68e4ff}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% -20%,#24466a,transparent 55%),var(--bg);color:var(--text);font:16px/1.5 system-ui,sans-serif;min-height:100vh}.stage{min-height:100vh;display:flex;flex-direction:column;padding:22px clamp(16px,4vw,60px) 26px}.top,.bottom{display:flex;align-items:center;justify-content:space-between;gap:16px}.brand{font-weight:900;letter-spacing:.1em}.top a,.control,.back{border:1px solid var(--line);border-radius:999px;padding:10px 16px;color:var(--text);background:#121c30;text-decoration:none;font:inherit;cursor:pointer}.slide{flex:1;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(260px,.9fr);gap:clamp(24px,5vw,76px);align-items:center;width:min(1300px,100%);margin:auto;padding:30px 0}.art{aspect-ratio:4/3;border:1px solid var(--line);border-radius:24px;background:linear-gradient(135deg,#152e48,#111827 55%,#24334b);display:grid;place-items:center;overflow:hidden;box-shadow:0 24px 80px #0006}.symbol{font-size:clamp(5rem,16vw,13rem);filter:drop-shadow(0 10px 22px #0008)}.copy .eyebrow{color:var(--lime);font-weight:800;letter-spacing:.16em;text-transform:uppercase;font-size:.82rem}.copy h1{font-size:clamp(2.3rem,5.5vw,5.4rem);line-height:1.02;letter-spacing:-.04em;margin:15px 0}.copy p{font-size:clamp(1rem,1.6vw,1.3rem);color:var(--muted);max-width:620px}.authors{margin:22px 0;color:var(--cyan);font-weight:700}.play{display:inline-block;background:var(--lime);color:#17220d;padding:13px 19px;border-radius:999px;text-decoration:none;font-weight:900}.bottom{width:min(1300px,100%);margin:0 auto}.counter{color:var(--muted);font-variant-numeric:tabular-nums}.controls{display:flex;gap:10px}.progress{height:3px;background:#243047;margin:20px 0 0}.bar{height:100%;width:12.5%;background:var(--lime);transition:width .25s}.help{font-size:.85rem;color:var(--muted)}@media(max-width:760px){.slide{grid-template-columns:1fr;gap:20px;padding:25px 0}.art{aspect-ratio:16/8}.symbol{font-size:6rem}.copy h1{font-size:2.7rem}.top{align-items:flex-start}.bottom{align-items:flex-start;flex-direction:column}.controls{width:100%}.control{flex:1}}
</style></head>
<body><main class="stage">
<header class="top"><div class="brand">🎮 MOSTRA CULTURAL 2026</div><a href="./index.html">← Catálogo de jogos</a></header>
<section class="slide" aria-live="polite"><div class="art" id="art"><div class="symbol" id="symbol">🌿</div></div><div class="copy"><div class="eyebrow" id="eyebrow">INFORMÁTICA EDUCACIONAL · PROJETOS AUTORAIS</div><h1 id="title">Ideias viram mundos.</h1><p id="desc">Conheça os jogos criados pelos educandos.</p><div class="authors" id="authors">Criação dos educandos</div><a class="play" id="play" href="#games" target="_blank" rel="noopener">EXPERIMENTAR JOGO ↗</a></div></section>
<div class="bottom"><div><div class="counter" id="counter">01 / 08</div><div class="help">Use ← → no teclado ou os controles para navegar</div></div><div class="controls"><button class="control" id="prev" type="button">← Anterior</button><button class="control" id="next" type="button">Próximo →</button><button class="control" id="auto" type="button">▶ Iniciar carrossel</button></div></div><div class="progress"><div class="bar" id="bar"></div></div>
</main>
<script>
const slides=[
{title:"Dora e os 3 Macacos",authors:"Mailyn · Felipe · Wendel · Emily",desc:"Uma aventura de exploração, enigmas e descobertas.",symbol:"🐒",url:"https://www.instaplay.ai/play/de4fa7c7?ref=quickarrow140",bg:"linear-gradient(135deg,#1e462f,#172b25,#111827)"},
{title:"Eivor: O Poder do Multiverso",authors:"Arthur",desc:"Realidades alternativas, fantasia e escolhas em mundos conectados.",symbol:"⚔️",url:"https://www.instaplay.ai/play/393f981a?ref=quickarrow140",bg:"linear-gradient(135deg,#172c54,#38285c,#111827)"},
{title:"Campos de Batalhas",authors:"Renan",desc:"Um mundo de conflitos, desafios e decisões conscientes.",symbol:"⚡",url:"https://www.instaplay.ai/play/campos-de-batalhas/12149968",bg:"linear-gradient(135deg,#183a56,#39274d,#111827)"},
{title:"Futebol Impossível: Legends Arcade",authors:"Pedro · Yury · Kauã",desc:"Futebol arcade com ritmo, personagens e jogadas impossíveis.",symbol:"⚽",url:"https://www.instaplay.ai/play/428ff247?ref=cybercrow87",bg:"linear-gradient(135deg,#1c5938,#163e5c,#111827)"},
{title:"Xerifes vs Furtivos",authors:"Ruan",desc:"Uma ilha, duas facções e um mistério a desvendar.",symbol:"🏝️",url:"https://www.instaplay.ai/play/db8f00a9?ref=cybercrow87",bg:"linear-gradient(135deg,#14505b,#4a2f30,#111827)"},
{title:"A Floresta Mágica",authors:"Vitória · Kaylane",desc:"Uma jornada fantástica para explorar e descobrir.",symbol:"🧚",url:"https://www.instaplay.ai/play/acb8330c?ref=cybercrow87",bg:"linear-gradient(135deg,#174d3d,#402b60,#111827)"},
{title:"Marlon: A Cidade Destruída",authors:"Nicolas · Apolo",desc:"Ação numa cidade destruída, com poderes especiais e inimigos perigosos.",symbol:"🔥",url:"https://www.instaplay.ai/play/6059be55?ref=cybercrow87",bg:"linear-gradient(135deg,#4a2525,#4b3022,#111827)"},
{title:"NEXUS Chess",authors:"Projeto complementar do educador",desc:"Xadrez digital como recurso complementar de aprendizagem.",symbol:"♟️",url:"https://nexus-chess.base44.app",bg:"linear-gradient(135deg,#173b50,#3d315b,#111827)"}
];
let index=0,timer=null;const $=id=>document.getElementById(id);
function render(){const s=slides[index];$("title").textContent=s.title;$("authors").textContent=s.authors;$("desc").textContent=s.desc;$("symbol").textContent=s.symbol;$("art").style.background=s.bg;$("play").href=s.url;$("counter").textContent=String(index+1).padStart(2,"0")+" / "+String(slides.length).padStart(2,"0");$("bar").style.width=((index+1)/slides.length*100)+"%";$("eyebrow").textContent=index===7?"PROJETO COMPLEMENTAR":"INFORMÁTICA EDUCACIONAL · PROJETOS AUTORAIS"}
function go(n){index=(n+slides.length)%slides.length;render()}$("prev").onclick=()=>go(index-1);$("next").onclick=()=>go(index+1);$("auto").onclick=()=>{if(timer){clearInterval(timer);timer=null;$("auto").textContent="▶ Iniciar carrossel"}else{timer=setInterval(()=>go(index+1),6500);$("auto").textContent="Ⅱ Pausar carrossel"}};document.addEventListener("keydown",e=>{if(e.key==="ArrowRight")go(index+1);if(e.key==="ArrowLeft")go(index-1);if(e.key==="Escape"&&timer){clearInterval(timer);timer=null;$("auto").textContent="▶ Iniciar carrossel"}});render();
</script></body></html>
